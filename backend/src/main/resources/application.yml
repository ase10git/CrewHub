server:
  error:
    whitelabel:
      enabled: false
  forward-headers-strategy: native

spring:
  application:
    name: CrewHub

app:
  name: ${APP_NAME:CrewHub}
  version: ${APP_VERSION:0.0.1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRE}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRE}

csrf:
  secret-key: ${CSRF_SECRET}

cookie:
  refresh-token:
    secure: ${REFRESH_TOKEN_COOKIE_SECURE}
    http-only: ${REFRESH_TOKEN_COOKIE_HTTPONLY}
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE}
    domain: ${REFRESH_TOKEN_COOKIE_DOMAIN}
  csrf-token:
    secure: ${CSRF_TOKEN_COOKIE_SECURE}
    http-only: ${CSRF_TOKEN_COOKIE_HTTPONLY}
    same-site: ${CSRF_TOKEN_COOKIE_SAME_SITE}
    domain: ${CSRF_TOKEN_COOKIE_DOMAIN}

security:
  login-fail:
    max-count: ${LOGIN_FAIL_MAX_COUNT}
    ttl-seconds: ${LOGIN_FAIL_TTL_SECONDS}
  login-ip:
    max-count: ${LOGIN_IP_MAX_COUNT}
    ttl-seconds: ${LOGIN_IP_TTL_SECONDS}

springdoc:
  api-docs:
    path: /api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}