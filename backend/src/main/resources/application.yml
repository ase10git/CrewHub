server:
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: CrewHub

app:
  name: ${APP_NAME:CrewHub}
  version: ${APP_VERSION:0.0.1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRE}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRE}
  cookie-secure: ${JWT_COOKIE_SECURE}
  cookie-httponly: ${JWT_COOKIE_HTTPONLY}
  cookie-samesite: ${JWT_COOKIE_SAMESITE}
  cookie-max-age: ${JWT_COOKIE_MAX_AGE_SECONDS}

springdoc:
  api-docs:
    path: /api-docs


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}