server:
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: CrewHub

app:
  name: ${APP_NAME:CrewHub}
  version: ${APP_VERSION:0.0.1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRE}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRE}

cookie:
  secure: ${COOKIE_SECURE}
  http-only: ${COOKIE_HTTPONLY}
  same-site: ${COOKIE_SAME_SITE}
  domain: ${COOKIE_DOMAIN}

springdoc:
  api-docs:
    path: /api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}