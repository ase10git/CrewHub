server:
  port: ${SEVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    database-platform: ${DATABASE_DIALECT}

logging:
  level:
    root: ${LOG_LEVEL}
    io.github.sunday: ${APP_LOG_LEVEL_DEV}
    org.springframework:
      security: ${APP_LOG_LEVEL_DEV}
      securityoauth2: ${APP_LOG_LEVEL_DEV}