server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
    database-platform: ${DATABASE_DIALECT}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    io.github.crewhub: ${APP_LOG_LEVEL:DEBUG}
    org.springframework:
      security: ${APP_LOG_LEVEL_DEV:INFO}
      securityoauth2: ${APP_LOG_LEVEL_DEV:INFO}
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:DEBUG}
